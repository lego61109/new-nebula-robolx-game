  for(let i=0;i<n;i++){const a=Math.random()*6.28,r=Math.random()*rng;d.position.set(Math.cos(a)*r,y,Math.sin(a)*r);d.rotation.y=Math.random()*6;d.scale.setScalar(.7+Math.random()*.8);d.updateMatrix();im.setMatrixAt(i,d.matrix);im.setColorAt(i,c.set(cols[i%cols.length]))}
  im.instanceColor.needsUpdate=true;scene.add(im)}
function deco(){scatter(240,105,new THREE.SphereGeometry(.28,6,5),[0xff5d8f,0xffd23f,0xffffff,0xb388ff,0xff8a3d],.35);scatter(600,108,new THREE.ConeGeometry(.25,.9,4),[0x3f9e3a,0x58b04a,0x2f8f3a],.45)}
function clouds(){for(let i=0;i<14;i++){const c=new THREE.Group();for(let j=0;j<4;j++){const p=new THREE.Mesh(new THREE.BoxGeometry(10+Math.random()*8,3,6),new THREE.MeshBasicMaterial({color:0xffffff}));p.position.set(j*7-10,Math.random()*2,Math.random()*3);c.add(p)}c.position.set((Math.random()-.5)*300,45+Math.random()*25,(Math.random()-.5)*300);scene.add(c)}}
function sky(c){scene.background.set(c);scene.fog.color.set(c)}
const WORLDS={
hangout(){
  ground.material.color.set(0x5cb04c);deco();
  flat(0,0,4,56,0xd9c79a);flat(0,8,60,4,0xd9c79a);
  fountain(-26,26);pond(30,26,6);house(46,20,9,8,0xf4a261);house(46,36,9,8,0x90be6d);
  bench(-6,14,0);bench(6,14,0);bench(-26,16,0);
  [[-8,2],[8,2],[-8,16],[8,16],[-14,26],[14,40]].forEach(p=>lamp(p[0],p[1]));
  for(let i=0;i<14;i++){const a=Math.random()*6.28,r=34+Math.random()*55;tree(Math.cos(a)*r,Math.sin(a)*r,.9+Math.random()*.7)}
},
obby(){
  ground.visible=false;GH=-100;sky(0xa8e6ff);clouds();
  const st=[0,2,0];SPAWN=st;addBox(0,-1,0,12,1,12,0x4ade80);boxes[boxes.length-1].cp=st;
  const N=56;
  for(let i=1;i<=N;i++){
    const a=i*.27,x=Math.cos(a)*26-26,z=Math.sin(a)*26,y=i*1.15,c=new THREE.Color().setHSL(i/N*.9,.8,.6).getHex();
    if(i%14===0){addBox(x,y-1,z,7,1,7,0x22c55e);boxes[boxes.length-1].cp=[x,y+2,z]}
    else{const w=i%5===2?3:4.5;addBox(x,y-1,z,w,1,w,c)}
    if(i%4===0)mkCoin(x,y+1.6,z);
  }
  const a=(N+1)*.27,x=Math.cos(a)*26-26,z=Math.sin(a)*26,y=(N+1)*1.15;
  addBox(x,y-1,z,10,1,10,0xffc107);boxes[boxes.length-1].cp=[x,y+2,z,1];
  [[-3,-3],[3,3],[-3,3],[3,-3]].forEach(p=>mkCoin(x+p[0],y+1.8,z+p[1],5,0x38bdf8));
},
rush(){
  ground.material.color.set(0xe9c46a);sky(0xffe9b8);clouds();COINRT=6000;SPAWN=[0,2,0];
  addBox(0,0,0,5,.3,5,0x3b82f6);
  [[24],[16],[9],[4]].forEach((p,i)=>addBox(30,i*1.5,-30,p[0],1.5,p[0],pal[i]));
  mkCoin(30,8.2,-30,25,0xff4fd8);
  for(let i=0;i<220;i++){const x=(Math.random()-.5)*190,z=(Math.random()-.5)*190;Math.random()>.93?mkCoin(x,1.6,z,10,0x38bdf8):mkCoin(x,1.6,z)}
  [[12,10],[-14,-12],[30,20],[-30,28],[8,-40],[-44,-20]].forEach(p=>{addBox(p[0],0,p[1],4,.3,4,0xec4899);boxes[boxes.length-1].bounce=true});
  for(let i=0;i<10;i++){const a=Math.random()*6.28,r=30+Math.random()*60;tree(Math.cos(a)*r,Math.sin(a)*r,1)}
},
town(){
  ground.material.color.set(0x7fbf5a);sky(0x9fd6ff);clouds();deco();SPAWN=[0,2,14];
  flat(0,0,14,220,0x4a4d52,.05);flat(0,0,220,14,0x4a4d52,.05);flat(0,0,24,24,0xcfd3da,.07);flat(0,0,.4,220,0xf5d142,.08);flat(0,0,220,.4,0xf5d142,.08);
  fountain(0,0);
  const hc=[0xf4a261,0x90be6d,0x8ecae6,0xe76f51,0xcdb4db,0xffd166];
  [-80,-60,-40,40,60,80].forEach((x,i)=>{house(x,-24,10,8,hc[i%6]);house(x,24,10,8,hc[(i+3)%6])});
  for(let i=-90;i<=90;i+=30){lamp(i,9);lamp(9,i);lamp(i,-9)}
  [[-24,3,0xe63946],[26,-3,0x457b9d],[-52,3,0xffb703],[56,-3,0x2a9d8f],[3,-30,0x9b5de5],[-3,34,0xf15bb5]].forEach(c=>car(c[0],c[1],c[2]));
  pond(-55,-60,7);bench(-45,-60,Math.PI/2);bench(-65,-60,-Math.PI/2);
  for(let i=0;i<40;i++){const x=(Math.random()-.5)*190,z=(Math.random()-.5)*190;if(Math.abs(x)>14&&Math.abs(z)>14&&Math.abs(Math.abs(z)-24)>9)tree(x,z,.9+Math.random()*.5)}
  for(let i=0;i<30;i++){const x=(Math.random()-.5)*180;mkCoin(x,1.6,Math.random()<.5?9:-9)}
}};
function buildWorld(){
  if(GAME!=='hangout'){scene.children.filter(o=>!o.isLight&&o!==sunM).forEach(o=>o.visible=false);boxes.length=0;coins.length=0}
  WORLDS[GAME]();
  P.x=SPAWN[0];P.y=SPAWN[1];P.z=SPAWN[2];
}
// ---------- start / loop ----------
function begin(){
  if(started)return;started=true;buildWorld();
  $('menu').style.display='none';$('ld').style.display='none';$('tl').style.display='flex';$('lc').style.display='flex';$('hb').style.display='flex';$('ct').style.display='flex';$('ci').style.display='block';$('coins').style.display='flex';$('cn').textContent=nCoins;
  if('ontouchstart' in window||navigator.maxTouchPoints>0){js.style.display='block';$('btns').style.display='flex'}
  me=makeChar(myCol,myName);P.hat=localStorage.hbHat||'';setHat(me,P.hat);log('Help','/e dance · /e wave · 1 block · 2 fireworks',0x8ab4ff);log('System','Say hi to everyone playing now! 👋',0xffd166);
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(started){
    step(dt);tick(dt);
    me.g.position.set(P.x,P.y,P.z);me.g.rotation.y=P.ry;
    animChar(me,P.walk&&P.ground,P.emote,dt);
    Object.values(others).forEach(o=>{
      const g=o.ch.g,k=Math.min(1,dt*10);
      g.position.x+=(o.tx-g.position.x)*k;g.position.y+=(o.ty-g.position.y)*k;g.position.z+=(o.tz-g.position.z)*k;
      let d=o.ry-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*k;
      animChar(o.ch,o.w,o.e,dt);
    });
    const dist=camDist,cp=Math.cos(pitch);
    cam.position.set(P.x+Math.sin(yaw)*dist*cp,P.y+3+Math.sin(pitch)*dist,P.z+Math.cos(yaw)*dist*cp);
    cam.lookAt(P.x,P.y+2.5,P.z);
  }else{
    const t=now/6000;cam.position.set(Math.sin(t)*40,18,Math.cos(t)*40);cam.lookAt(0,3,0);
  }
  ren.render(scene,cam);
}
requestAnimationFrame(loop);

// ---------- Roblox-style home: account, friends, servers ----------
const LS=localStorage;
const GAMES={
 hangout:{n:'Hangout Blocks',e:'🧱🙂',r:97,d:'Hang out in the park, chat, build with blocks, shop for hats and race the lava obby.'},
 obby:{n:'Sky Obby',e:'🌈🏃',r:94,d:'Climb the rainbow spiral tower. Checkpoints save your progress, and the golden finish pays 25 coins.'},
 rush:{n:'Coin Rush',e:'🪙💎',r:91,d:'A giant desert full of coins that respawn fast. Hunt blue gems and the pink diamond on top of the pyramid.'},
 town:{n:'Blocky Town',e:'🏠🚗',r:89,d:'A roleplay town with houses, roads, a plaza fountain, a park pond and parked cars to climb on.'}};
const GTH={hangout:'linear-gradient(#87ceeb 58%,#58b04a 58%)',obby:'linear-gradient(#7ad7ff,#ff9ad5)',rush:'linear-gradient(#ffe08a,#ff9f1c)',town:'linear-gradient(#9bd1ff 55%,#8aa1b1 55%)'};
let GAME='hangout';
const SID=n=>PRE+GAME+'-'+n;
function showLd(){$('ld').firstChild.nodeValue=GAMES[GAME].n;$('ld').style.display='flex'}
function drawG(){
  const q=($('se').value||'').toLowerCase(),L=$('gl');L.textContent='';
  Object.keys(GAMES).filter(k=>GAMES[k].n.toLowerCase().includes(q)).forEach(k=>{
    const g=GAMES[k],d=document.createElement('div'),t=document.createElement('div'),sm=document.createElement('small');
    d.className='gc';t.className='th';t.style.background=GTH[k];t.textContent=g.e;sm.textContent='👍 '+g.r+'% Rating';
    d.append(t,document.createTextNode(g.n),sm);d.onclick=()=>openGame(k);L.append(d)});
}
function openGame(k){GAME=k;const g=GAMES[k];$('gt').textContent=g.n;$('gd').textContent=g.d;const t=$('gth');t.style.background=GTH[k];t.textContent=g.e;$('gp').style.display='block';refresh()}
let user=null,friends=[],pp,online={},adding='',tt,cols={},gms={};
try{user=JSON.parse(LS.hbUser);friends=JSON.parse(LS.hbFr)||[]}catch(e){}
if(!user||!user.n){
  let n=(prompt('Choose a username (3-12 letters, numbers or _):')||'').replace(/\W/g,'').slice(0,12);
  if(n.length<3)n='Player'+(Math.random()*9000+1000|0);
  user={n,c:'#'+[0,0,0].map(()=>(Math.random()*150+60|0).toString(16).padStart(2,'0')).join('')};
}
function avSVG(c){if(!/^#[0-9a-f]{6}$/i.test(c))c='#3b82f6';return '<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#d9dbe0"/><rect x="8" y="64" width="14" height="40" rx="4" fill="#f5cd30"/><rect x="78" y="64" width="14" height="40" rx="4" fill="#f5cd30"/><rect x="22" y="62" width="56" height="42" rx="6" fill="'+c+'"/><rect x="33" y="22" width="34" height="34" rx="7" fill="#f5cd30"/><rect x="42" y="34" width="4" height="9" fill="#111"/><rect x="54" y="34" width="4" height="9" fill="#111"/><path d="M42 47q8 7 16 0" stroke="#111" fill="none" stroke-width="3"/></svg>'}
function hc(n){let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))|0;return '#'+[0,1,2].map(i=>(((h>>(i*8))&127)+90).toString(16).padStart(2,'0')).join('')}
function save(){LS.hbUser=JSON.stringify(user);LS.hbFr=JSON.stringify(friends)}save();
function prep(){myName=user.n;myCol=parseInt(user.c.slice(1),16)}
function toast(t){if(!/^Finding/.test(t))$('ld').style.display='none';const e=$('st');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3000)}
function tryJoin(n){
  if(n>8)return toast('All servers are busy');
  toast('Finding a server…');
  net(false,n,r=>{
    if(r==='none')net(true,n,r2=>r2==='taken'?tryJoin(n):toast('Error: '+r2));
    else if(r==='full')tryJoin(n+1);else toast('Error: '+r);
  });
}
function tryHost(n){if(n>8)return toast('No free servers');net(true,n,r=>r==='taken'?tryHost(n+1):toast('Error: '+r))}
function joinServer(n){prep();showLd();net(false,n,r=>toast(r==='full'?'Server is full':'Could not join that server'))}
function probe(cb){
  const res={},pr=new Peer();
  pr.on('error',()=>{});
  pr.on('open',()=>{for(let n=1;n<=8;n++){const c=pr.connect(SID(n));c.on('open',()=>c.send({t:'info'}));c.on('data',m=>{res[n]=m.n;c.close()})}});
  setTimeout(()=>{pr.destroy();cb(res)},3500);
}
function refresh(){
  const L=$('sl');L.textContent='Searching for servers…';
  probe(r=>{
    L.textContent='';const ks=Object.keys(r);
    if(!ks.length)L.textContent='No servers yet. Press Play to start one.';
    ks.forEach(n=>{
      const d=document.createElement('div'),b=document.createElement('button');d.className='sv';
      d.append(document.createTextNode('Server '+n+' · '+r[n]+' of 10 people max'));
      b.textContent=r[n]>=10?'Full':'Join';b.disabled=r[n]>=10;b.onclick=()=>joinServer(+n);d.append(b);L.append(d);
    });
  });
}
function addF(n){if(!friends.includes(n)){friends.push(n);save();drawF()}}
function addFriend(n){
  n=n.replace(/\W/g,'');
  if(!n||n.toLowerCase()===user.n.toLowerCase())return toast("That's you!");
  if(friends.includes(n))return toast('Already friends');
  if(!pp||!pp.open)return toast('Not connected yet');
  adding=n;toast('Request sent to '+n);
  const c=pp.connect(UP+n.toLowerCase());
  c.on('open',()=>c.send({t:'fr',n:user.n}));
  c.on('data',m=>{if(m.t==='fa'){addF(m.n||n);toast(n+' accepted!')}else if(m.t==='fd')toast(n+' declined')});
}
function startPresence(k){
  pp=new Peer(UP+user.n.toLowerCase());
  pp.on('error',e=>{
    if(e.type==='unavailable-id'){if(k<3)setTimeout(()=>startPresence(k+1),2500);else toast('That username is already online')}
    else if(e.type==='peer-unavailable'&&adding&&e.message.toLowerCase().includes(adding.toLowerCase())){toast(adding+' is offline');adding=''}
  });
  pp.on('open',()=>setTimeout(poll,600));pp.on('connection',c=>c.on('data',m=>{
    if(m.t==='q')c.send({t:'st',s:started?srvNum:0,c:user.c,g:GAME});
    else if(m.t==='fr'){if(friends.includes(m.n)||confirm(m.n+' wants to be your friend. Accept?')){addF(m.n);c.send({t:'fa',n:user.n})}else c.send({t:'fd'})}
  }));
}
function poll(){
  const seen={};
  friends.forEach(f=>{const c=pp.connect(UP+f.toLowerCase());c.on('open',()=>c.send({t:'q'}));c.on('data',m=>{seen[f]=m.s||-1;cols[f]=m.c;gms[f]=m.g;c.close()})});
  setTimeout(()=>{online=seen;drawF()},2500);
}
function drawF(){
  const r=$('fr');r.textContent='';$('fh').textContent='Friends ('+friends.length+') ›';
  const mk=(em,name,sub,on,fn,col)=>{
    const d=document.createElement('div'),a=document.createElement('div'),s=document.createElement('small');
    d.className='f';a.className='av'+(on?' on':'');if(col)a.innerHTML=avSVG(col);else a.textContent=em;s.textContent=sub||'';
    d.append(a,document.createTextNode(name),s);d.onclick=fn;r.append(d);
  };
  mk('＋','Add Friends','',0,()=>{const n=(prompt('Username to add:')||'').trim();n&&addFriend(n)});
  friends.forEach(f=>{const s=online[f];mk('',f,s>0?(GAMES[gms[f]]||GAMES.hangout).n+' #'+s:s?'Online':'',!!s,()=>s>0?(GAME=GAMES[gms[f]]?gms[f]:'hangout',joinServer(s)):toast(f+(s?' is not in a game':' is offline')),cols[f]||hc(f))});
}
$('un').innerHTML='<span class="uav">'+avSVG(user.c)+'</span>';$('un').append(document.createTextNode(user.n));
drawG();
$('gb').onclick=()=>$('gp').style.display='none';
$('rf').onclick=refresh;
function adminGo(){
  const c=$('ac').value.trim();
  if(c==='Nebula'){$('ac').value='';prep();begin();$('hud').textContent='Singleplayer (Admin)';toast('Admin access granted')}
  else toast('Wrong admin code');
}
$('ab').onclick=adminGo;$('ac').onkeydown=e=>{if(e.key==='Enter')adminGo()};
$('pb').onclick=()=>{prep();showLd();tryJoin(1)};
$('nb').onclick=()=>{prep();showLd();tryHost(1)};
$('sa').onclick=()=>{$('cc').value=user.c;$('cc').click()};
$('cc').onchange=e=>{user.c=e.target.value;save();$('un').firstChild.innerHTML=avSVG(user.c);if(started){me.body.children[0].material.color.set(user.c);myCol=parseInt(user.c.slice(1),16)}toast('Avatar color updated')};
document.querySelectorAll('[data-x]').forEach(a=>a.onclick=()=>toast('Coming soon'));
$('se').oninput=drawG;
$('bk').onclick=()=>{const h=$('hb');h.style.visibility=h.style.visibility==='hidden'?'visible':'hidden'};
$('bp').onclick=()=>{const p=$('plist');p.style.display=p.style.display==='none'?'':'none'};
$('bi').onclick=()=>{const u=location.origin+location.pathname+'?join='+GAME+'-'+srvNum;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Invite link copied!'),()=>toast(u))};
$('b1').onclick=$('cp').onclick=()=>{shop();$('sh').style.display='flex'};
$('sx').onclick=()=>$('sh').style.display='none';
$('b2').onclick=()=>P.emote=!P.emote;
$('b3').onclick=()=>P.emote=P.emote===2?false:2;
$('b4').onclick=()=>{$('cc').value=user.c;$('cc').click()};
$('b5').onclick=togglePm;
$('h1').onclick=placeBlock;$('h2').onclick=firework;
const jp=new URLSearchParams(location.search).get('join');
if(jp&&/^(hangout|obby|rush|town)-[1-8]$/.test(jp))setTimeout(()=>{GAME=jp.split('-')[0];joinServer(+jp.split('-')[1])},1500);
drawF();startPresence(0);
setInterval(()=>pp&&pp.open&&poll(),9000);
</script>
